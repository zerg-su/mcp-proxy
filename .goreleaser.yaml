version: 2
builds:
  - id: mcp-proxy
    main: .
    binary: mcp-proxy
    # goreleaser adds neither of these on its own: -trimpath keeps the runner's
    # absolute paths out of the released binaries, and -buildvcs=false keeps Go
    # from stamping vcs.revision/vcs.modified alongside the version below.
    flags:
      - -trimpath
      - -buildvcs=false
    # The Makefile builds with CGO off; without this the release path differed
    # from the local one by more than the version stamp.
    env:
      - CGO_ENABLED=0
    # Otherwise archive mtimes come from the wall clock at release time.
    mod_timestamp: '{{ .CommitTimestamp }}'
    # The v prefix is restored on purpose: .Version strips it, while the Makefile
    # stamps `git describe` output, which keeps it. Without this the same commit
    # reports 0.58.0-h1 from a release binary and v0.58.0-h1 from a local one,
    # and incident triage has to know which path produced the artifact in hand
    # before it can match a version string to a tag.
    ldflags:
      - -s -w -X main.BuildVersion=v{{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Upstream excluded windows/arm64. Nothing here needs CGO or a
    # platform-specific dependency, so the target costs one more cross-compile on
    # a runner already building five, and the exclusion only meant an ARM Windows
    # machine had no artifact at all.

archives:
  - id: default
    # Stated rather than inherited: this block exists to override the Windows
    # format, and spelling out the rest keeps a goreleaser upgrade from changing
    # archive contents or names silently. The name_template is the v2 default
    # copied verbatim, so asset names stay byte-identical to v1.1.0-h2 and
    # anything pinning a download URL keeps working.
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    formats:
      - tar.gz
    # Windows shipped as .tar.gz, which Explorer cannot open without a
    # third-party archiver. On the standalone delivery path the download is the
    # first thing a Windows user meets, so it is a zip there.
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: license*
      - src: LICENSE*
      - src: readme*
      - src: README*
      - src: changelog*
      - src: CHANGELOG*

# The image gets a CycloneDX SBOM from scripts/scan-image.sh, but the archives
# people download had none - and on the standalone path the archive is the only
# artifact that ever reaches a machine. Same format as the image side, so one
# question ("which builds contain this package") has one kind of answer.
sboms:
  - id: archives
    artifacts: archive
    documents:
      - '${artifact}.cyclonedx.json'
    args:
      - '$artifact'
      - '--output'
      - 'cyclonedx-json=$document'

# Keyless signing: Sigstore issues the certificate against this workflow's OIDC
# identity, so there is no private key to store, rotate or leak, and the
# signature records which repository, workflow and tag produced the artifact -
# not merely that someone holding a key vouched for it.
#
# Only the checksum file is signed, which covers everything: checksums.txt holds
# the SHA-256 of every archive, so one signature plus one sha256sum verifies any
# of them, and the release page carries one signature file instead of one per
# archive.
#
# One .sigstore.json bundle, not the .sig/.pem pair this block produced until
# v1.1.0-h3 failed on it. cosign 3.0.6 - the version pinned in goreleaser.yml -
# defaults to --new-bundle-format, which packs signature, certificate and
# inclusion proof into one file, and then *ignores* --output-signature and
# --output-certificate rather than refusing them. cosign was consequently left
# signing into an empty --bundle path and died with "create bundle file: open :
# no such file or directory", after all six archives and six SBOMs had been
# built. The deprecated pair can still be revived with
# `--use-signing-config=false --new-bundle-format=false`; that was rejected
# because it is the format scheduled for removal, and because the bundle carries
# the transparency-log inclusion proof and timestamp that the .sig/.pem pair
# made the consumer fetch separately.
#
# goreleaser has no `bundle` setting. `signature` is simply the file the signer
# is expected to write, and goreleaser uploads whatever it names. `certificate`
# is deliberately absent: cosign writes no separate certificate file any more,
# and a `certificate` pointing at a file nothing creates registers a release
# asset that does not exist - which goreleaser 2.18.2 only warns about here and
# then fails on much later, during upload, with the release already created.
#
#   cosign verify-blob \
#     --bundle mcp-proxy_<version>_checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github\.com/zerg-su/mcp-proxy/\.github/workflows/goreleaser\.yml@refs/tags/v.+-h[0-9]+$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     mcp-proxy_<version>_checksums.txt
#
# The identity flags are mandatory, not advisory: cosign exits 1 with
# "--certificate-identity or --certificate-identity-regexp is required for
# verification in keyless mode" if they are absent, so nobody can skip them by
# accident. What *is* silent is a loose pattern. cosign matches the regexp as a
# substring, so an unanchored '^https://github.com/zerg-su/mcp-proxy/' would
# also accept a certificate minted by any other workflow in this repository that
# holds id-token: write, on any ref. Both ends are anchored, and the tag shape
# is part of the pattern, so only a tag-triggered run of this workflow verifies.
signs:
  - id: checksum
    cmd: cosign
    # The file cosign is told to write, and the name goreleaser uploads it
    # under. `.sigstore.json` is the Sigstore bundle convention and what
    # `cosign verify-blob --bundle` expects to be handed.
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    # Without this, goreleaser swallows cosign's stderr unless the entire run is
    # --verbose. cosign's deprecation warnings were the only notice before the
    # failure above, and they are what made it diagnosable from the run log.
    output: true

changelog:
  disable: false
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\([\w-]+\))?!?:.*'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix(\([\w-]+\))?!?:.*'
      order: 1
    - title: "Refactor"
      regexp: '^refactor(\([\w-]+\))?!?:.*'
      order: 2
    - title: "Build Process Updates"
      regexp: '^(build|ci)(\([\w-]+\))?!?:.*'
      order: 3
    - title: "Documentation Updates"
      regexp: '^docs(\([\w-]+\))?!?:.*'
      order: 4
    - title: "Maintenance"
      regexp: '^chore(\([\w-]+\))?!?:.*'
      order: 5
    - title: Others
      order: 999
