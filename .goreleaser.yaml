version: 2
builds:
  - id: mcp-proxy
    main: .
    binary: mcp-proxy
    # goreleaser adds neither of these on its own: -trimpath keeps the runner's
    # absolute paths out of the released binaries, and -buildvcs=false keeps Go
    # from stamping vcs.revision/vcs.modified alongside the version below.
    flags:
      - -trimpath
      - -buildvcs=false
    # The Makefile builds with CGO off; without this the release path differed
    # from the local one by more than the version stamp.
    env:
      - CGO_ENABLED=0
    # Otherwise archive mtimes come from the wall clock at release time.
    mod_timestamp: '{{ .CommitTimestamp }}'
    # The v prefix is restored on purpose: .Version strips it, while the Makefile
    # stamps `git describe` output, which keeps it. Without this the same commit
    # reports 0.58.0-h1 from a release binary and v0.58.0-h1 from a local one,
    # and incident triage has to know which path produced the artifact in hand
    # before it can match a version string to a tag.
    ldflags:
      - -s -w -X main.BuildVersion=v{{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
changelog:
  disable: false
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\([\w-]+\))?!?:.*'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix(\([\w-]+\))?!?:.*'
      order: 1
    - title: "Refactor"
      regexp: '^refactor(\([\w-]+\))?!?:.*'
      order: 2
    - title: "Build Process Updates"
      regexp: '^(build|ci)(\([\w-]+\))?!?:.*'
      order: 3
    - title: "Documentation Updates"
      regexp: '^docs(\([\w-]+\))?!?:.*'
      order: 4
    - title: "Maintenance"
      regexp: '^chore(\([\w-]+\))?!?:.*'
      order: 5
    - title: Others
      order: 999
