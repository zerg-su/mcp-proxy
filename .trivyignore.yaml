# No findings are currently accepted. The file stays because the rules for
# adding one are the useful part, and because an empty list is a statement: the
# publishing gate blocks on every fixable HIGH or CRITICAL in the image, with
# nothing excused.
#
# Four npm findings lived here once - brace-expansion twice, ip-address,
# node-tar, all bundled inside npm - accepted on the grounds that no published
# npm fixed them. That was wrong, and wrong in the direction that matters: the
# check had been made against npm 12.0.2, the `latest` tag, which still bundles
# the vulnerable versions, while the fix had been backported to the 11.x line.
# The image now pins npm 11.19.1 and the entries are gone. The lesson is in the
# rules below.
#
# Before adding an entry:
#
#   - Demonstrate that no fix is available, and say how you looked. "The latest
#     version still has it" is not the same as "no version has it": check the
#     maintained lines, not just the newest tag.
#   - Scope it with `paths` to the exact file. An unscoped id excuses that
#     vulnerability everywhere in the image, including in a component that
#     arrives later - which is the failure this file exists to prevent.
#   - Give it an `expired_at`. Trivy enforces it, so the exception has to be
#     re-argued rather than inherited. Delete entries when they stop being
#     needed; scripts/scan-image.sh reports which ones are no longer
#     load-bearing.
#
# Format:
#
#   vulnerabilities:
#     - id: CVE-0000-00000
#       paths: [usr/local/lib/node_modules/...]
#       statement: what it is, and why the fix is not ours to apply
#       expired_at: 2026-12-17
vulnerabilities: []
